name: Build demoparser2 WASM

on:
  workflow_dispatch: {} # manual trigger - use this for the first run
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC - keeps pace with upstream fixes automatically

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          path: dashboard

      - name: Checkout demoparser2 source
        uses: actions/checkout@v4
        with:
          repository: LaihoE/demoparser
          path: demoparser

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install protoc
        uses: arduino/setup-protoc@v3

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM package
        working-directory: demoparser/src/wasm
        run: wasm-pack build --target web --release

      - name: Record upstream commit for traceability
        run: git -C demoparser rev-parse HEAD > demoparser/src/wasm/pkg/UPSTREAM_COMMIT.txt

      - name: Vendor the build output into this repo
        run: |
          rm -rf dashboard/public/vendor/demoparser2-wasm
          mkdir -p dashboard/public/vendor/demoparser2-wasm
          cp -r demoparser/src/wasm/pkg/* dashboard/public/vendor/demoparser2-wasm/

      - name: Commit if changed
        working-directory: dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/vendor/demoparser2-wasm
          git diff --staged --quiet && echo "No changes - upstream unchanged since last build" || git commit -m "chore: rebuild demoparser2 WASM from upstream $(cat public/vendor/demoparser2-wasm/UPSTREAM_COMMIT.txt)"
          git push
